        <h1>SQL: DROP TABLE Statement</h1>
        <hr>
        <p>The DROP TABLE statement allows you to remove a table from the database.</p>
        <p>The basic syntax for the DROP TABLE statement is:</p>
        <blockquote class="definition">
          <p>DROP TABLE table_name;</p>
        </blockquote>
        <br>
        <p class="example_heading">For example:</p>
        <blockquote class="sql_command">
          <p>DROP TABLE supplier;</p>
        </blockquote>
        <p>This would drop table called <i>supplier</i>.</p>
