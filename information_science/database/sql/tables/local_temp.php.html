        <h1>SQL: Local Temporary tables</h1>
        <hr>
        <p>Local temporary tables are distinct within modules and embedded SQL programs within SQL sessions.</p>
        <p>The basic syntax is:</p>
        <blockquote class="definition">
          <p>DECLARE LOCAL TEMPORARY TABLE table_name ( ...);</p>
